<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two-Tone</title>
    <meta
      name="description"
      content="A falling-circle dodge game where colour, not distance, decides whether a hit is safe."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Two-Tone <span class="version">v1.1</span></h1>
      <ul class="controls-bar" aria-label="Controls">
        <li class="control-chip chip-1"><kbd>&larr;</kbd> <kbd>&rarr;</kbd>/<kbd>A</kbd><kbd>D</kbd> move</li>
        <li class="control-chip chip-2">Double-tap &larr;/&rarr; dash</li>
        <li class="control-chip chip-3"><kbd>Space</kbd> cycle colour</li>
        <li class="control-chip chip-4"><kbd>1</kbd>&ndash;<kbd>9</kbd>,<kbd>0</kbd> pick colour</li>
        <li class="control-chip chip-5">Hold <kbd>&darr;</kbd> slow-mo</li>
        <li class="control-chip chip-6"><kbd>N</kbd> neutral</li>
        <li class="control-chip chip-7"><kbd>M</kbd> mute</li>
        <li class="control-chip chip-8">Drag / tap dot to move</li>
      </ul>
      <div class="game-layout">
        <div class="game-wrap">
          <canvas id="game" tabindex="0" aria-label="Game area"></canvas>
          <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
